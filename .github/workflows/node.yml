name: CI Pipeline

on:
  push:
    branches: [develop, staging, production]
  pull_request:
    branches: [develop, staging, production]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          cd client
          npm ci

      - name: Run Prettier
        run: |
          cd client
          npx prettier --check .

      - name: Run Tests
        run: |
          cd client
          npm test -- --coverage
